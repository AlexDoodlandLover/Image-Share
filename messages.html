<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Minecraft Skin Converter</title>
<style>
  body { font-family: sans-serif; padding: 20px; background: #f0f0f0; }
  input, button { margin: 5px; }
  canvas { border: 1px solid #ccc; margin-top: 10px; }
</style>
</head>
<body>

<h2>Minecraft New → Classic Skin Converter</h2>

<input type="file" id="skinInput" accept="image/png">
<button onclick="convertSkin()">Convert</button>
<br>
<canvas id="canvas" width="64" height="64"></canvas>
<br>
<a id="downloadLink" href="#" download="classic_skin.png">Download Classic Skin</a>

<script>
function convertSkin() {
    const file = document.getElementById('skinInput').files[0];
    if(!file) return alert("Select a PNG skin!");

    const reader = new FileReader();
    reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
            // Create canvas to manipulate skin
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            // Clear canvas
            ctx.clearRect(0,0,64,64);

            // Draw original skin
            ctx.drawImage(img, 0, 0);

            // Remove all second-layer pixels (modern skins have extra layer at certain areas)
            // Top layer areas (hat, jacket, sleeves, pants) coordinates
            const secondLayerAreas = [
                [32,0,32,16],   // head overlay
                [32,16,32,16],  // body overlay
                [48,48,16,16],  // right arm overlay
                [32,48,16,16],  // left arm overlay
                [48,32,16,16],  // right leg overlay
                [32,32,16,16]   // left leg overlay
            ];

            ctx.clearRect(...secondLayerAreas[0]);
            ctx.clearRect(...secondLayerAreas[1]);
            ctx.clearRect(...secondLayerAreas[2]);
            ctx.clearRect(...secondLayerAreas[3]);
            ctx.clearRect(...secondLayerAreas[4]);
            ctx.clearRect(...secondLayerAreas[5]);

            // Downscale to 32x32 classic skin
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 32;
            tempCanvas.height = 32;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(canvas,0,0,32,32);

            // Put scaled classic skin back into main canvas for preview
            canvas.width = 32;
            canvas.height = 32;
            ctx.drawImage(tempCanvas,0,0);

            // Update download link
            document.getElementById('downloadLink').href = canvas.toDataURL('image/png');
        }
        img.src = e.target.result;
    }
    reader.readAsDataURL(file);
}
</script>

</body>
</html>
