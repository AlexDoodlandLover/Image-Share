<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image Reviver Decoder</title>
<style>
  body { font-family: sans-serif; background: #f0f0f0; padding: 20px; }
  input, button { margin: 5px; }
  .output { margin-top: 20px; border: 1px solid #ccc; padding: 10px; background: #fff; }
</style>
</head>
<body>

<h2>Image Reviver Decoder</h2>

<input type="text" id="codeInput" placeholder="Paste your 25-char code">
<button onclick="decodeCode()">Decode</button>

<div class="output" id="output"></div>

<script>
// Compact pseudo-Base64 decoder (matches the sender)
function compactDecode(code) {
  code = code.replace(/0+$/,''); // remove padded zeros
  return atob(code);
}

function decodeCode() {
  const code = document.getElementById('codeInput').value;
  const output = document.getElementById('output');
  try {
    const decoded = compactDecode(code);
    const parts = decoded.split('|');
    const user = parts[0];
    const name = parts[1];
    const base64 = parts[2];
    const img = new Image();
    img.src = 'data:image/png;base64,' + base64;
    
    output.innerHTML = `<p><b>Username:</b> ${user}</p>
                        <p><b>Image Name:</b> ${name}</p>
                        <p><b>Image Preview:</b><br>${img.outerHTML}</p>`;
  } catch(e) {
    output.innerHTML = "<p style='color:red'>Invalid code!</p>";
  }
}
</script>

</body>
</html>
