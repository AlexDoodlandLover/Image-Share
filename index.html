<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Image Sender / Receiver</title>
<style>
    body {
        font-family: -apple-system, Helvetica, Arial;
        background: #f2f2f7;
        margin: 0;
        padding: 15px;
        color: #000;
    }
    h1 {
        text-align: center;
        font-size: 22px;
        margin-bottom: 20px;
    }
    .mode-btn {
        width: 48%;
        padding: 12px;
        margin: 1%;
        font-size: 16px;
        background: #ddd;
        border: 1px solid #aaa;
        border-radius: 8px;
    }
    #send-section, #receive-section {
        display: none;
        margin-top: 20px;
        background: #fff;
        padding: 15px;
        border-radius: 12px;
        border: 1px solid #ccc;
    }
    input, button, textarea {
        width: 100%;
        margin: 8px 0;
        padding: 10px;
        font-size: 16px;
    }
    textarea {
        height: 120px;
    }
    img {
        max-width: 100%;
        margin-top: 10px;
        border-radius: 12px;
    }
</style>
</head>
<body>

<h1>Image Transfer</h1>

<!-- MODE BUTTONS -->
<button class="mode-btn" onclick="showSend()">Send</button>
<button class="mode-btn" onclick="showReceive()">Receive</button>

<!-- SEND MODE -->
<div id="send-section">
    <h2>Send Mode</h2>
    <label>Username:</label>
    <input id="send-user" type="text">

    <label>Image Name:</label>
    <input id="send-name" type="text">

    <label>Select Image:</label>
    <input id="send-file" type="file" accept="image/*">

    <button onclick="generateCode()">Generate Code</button>

    <label>Share Code:</label>
    <textarea id="output-code" readonly></textarea>
</div>

<!-- RECEIVE MODE -->
<div id="receive-section">
    <h2>Receive Mode</h2>

    <label>Paste Code:</label>
    <textarea id="receive-code"></textarea>

    <button onclick="decodeCode()">Decode</button>

    <h3 id="receive-info"></h3>
    <img id="receive-img">
</div>

<script>
// Switch between sections
function showSend() {
    document.getElementById('send-section').style.display = 'block';
    document.getElementById('receive-section').style.display = 'none';
}
function showReceive() {
    document.getElementById('send-section').style.display = 'none';
    document.getElementById('receive-section').style.display = 'block';
}

// Turning the image into a Base64 code
function generateCode() {
    const user = document.getElementById('send-user').value.trim();
    const name = document.getElementById('send-name').value.trim();
    const file = document.getElementById('send-file').files[0];

    if (!user || !name || !file) {
        alert("Fill everything out!");
        return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
        const base64 = e.target.result;

        const payload = "IMG|" + user + "|" + name + "|" + base64;

        // Encode again for shorter share code
        const finalCode = btoa(unescape(encodeURIComponent(payload)));

        document.getElementById('output-code').value = finalCode;
    };
    reader.readAsDataURL(file);
}

// Turning the code back into an image
function decodeCode() {
    const code = document.getElementById('receive-code').value.trim();
    if (!code) {
        alert("Paste a code!");
        return;
    }

    try {
        const decoded = decodeURIComponent(escape(atob(code)));
        const parts = decoded.split("|");

        if (parts[0] !== "IMG") {
            alert("Invalid code!");
            return;
        }

        const user = parts[1];
        const name = parts[2];
        const imageData = parts[3];

        document.getElementById('receive-info').innerText =
            "From: " + user + "  —  Image: " + name;

        document.getElementById('receive-img').src = imageData;

    } catch (err) {
        alert("Invalid or corrupted code!");
    }
}
</script>

</body>
</html>
